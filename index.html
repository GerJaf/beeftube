<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>BeefTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: cabecera fija + barra lateral de alias + cuadrícula de videos; la vista "ver" pone el reproductor y la cola "a continuación" al lado. */
:root {
  color-scheme: dark;
  --bg: #0e0b0b;
  --panel: #1a1414;
  --panel-2: #251c1c;
  --line: #2f2525;
  --fg: #f3ecea;
  --muted: #a8998f;
  --accent: #e3262f;
  --accent-soft: #3a1416;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font-body); }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

header {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 16px;
  padding: 10px var(--gutter-r) 10px var(--gutter-l);
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.menu-btn { display: none; background: none; border: 0; padding: 6px; cursor: pointer; }
.menu-btn svg { width: 24px; height: 24px; display: block; fill: var(--fg); }
.logo { display: flex; align-items: center; gap: 8px; flex: none; }
.logo-mark {
  width: 34px; height: 24px; border-radius: 7px; background: var(--accent);
  display: grid; place-items: center;
}
.logo-mark svg { width: 12px; height: 12px; fill: #fff; margin-left: 2px; }
.logo-word { font: 800 19px/1 var(--font-display); letter-spacing: -0.5px; }
.logo-word small { font: 600 10px var(--font-body); color: var(--muted); letter-spacing: 1px; margin-left: 4px; vertical-align: super; }
.search { flex: 1; max-width: 560px; margin: 0 auto; display: flex; }
.search input {
  flex: 1; min-width: 0; background: var(--panel); color: var(--fg);
  border: 1px solid var(--line); border-right: 0; border-radius: 999px 0 0 999px;
  padding: 9px 16px; font: inherit; outline: none;
}
.search input:focus { border-color: var(--accent); }
.search button {
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 0 999px 999px 0;
  padding: 0 18px; cursor: pointer;
}
.search button svg { width: 18px; height: 18px; fill: var(--fg); display: block; }
.count { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }

.shell { display: grid; grid-template-columns: 232px 1fr; }
aside {
  position: sticky; top: 57px; align-self: start; height: calc(100vh - 57px); overflow-y: auto;
  padding: 12px 12px 24px var(--gutter-l); border-right: 1px solid var(--line);
}
aside h3 { font: 600 11px var(--font-body); text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin: 18px 12px 6px; }
aside h3:first-child { margin-top: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 9px 12px; border: 0; border-radius: 10px; background: none; cursor: pointer; text-align: left;
}
.nav-item:hover { background: var(--panel); }
.nav-item.on { background: var(--accent-soft); color: #fff; font-weight: 600; }
.nav-item .dot { width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 800 10px var(--font-display); color: #fff; }
.nav-item .n { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.nav-item.on .n { color: #f0b9bb; }
aside p.note { color: var(--muted); font-size: 12px; margin: 22px 12px 0; line-height: 1.5; }

main { min-width: 0; padding: 0 var(--gutter-r) 48px 24px; }
.chips { display: flex; gap: 10px; padding: 14px 0; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; padding: 7px 14px; border-radius: 9px; border: 0; cursor: pointer;
  background: var(--panel-2); font-weight: 500; font-size: 14px;
}
.chip:hover { background: var(--line); }
.chip.on { background: var(--fg); color: var(--bg); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 28px 18px; }
.card { display: flex; flex-direction: column; gap: 10px; min-width: 0; cursor: pointer; }
.thumb { position: relative; aspect-ratio: 16/9; max-width: 100%; border-radius: 12px; overflow: hidden; background: var(--panel); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s; }
.card:hover .thumb img { transform: scale(1.04); }
.dur { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.82); color: #fff; font-size: 12px; font-weight: 600; padding: 1px 5px; border-radius: 4px; font-variant-numeric: tabular-nums; }
.meta { display: flex; gap: 12px; min-width: 0; }
.avatar { width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 800 11px var(--font-display); color: #fff; }
.meta-text { min-width: 0; }
.title { font-weight: 600; font-size: 15px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.empty { color: var(--muted); padding: 60px 0; text-align: center; }
.more { display: block; margin: 32px auto 0; padding: 10px 22px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 600; }
.more:hover { background: var(--panel-2); }

/* Vista de reproducción */
.watch { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; padding-top: 20px; }
.player { aspect-ratio: 16/9; width: 100%; max-width: 100%; border-radius: 14px; overflow: hidden; background: #000; }
.player iframe { width: 100%; height: 100%; border: 0; display: block; }
.watch h1 { font: 700 20px/1.3 var(--font-body); margin: 14px 0 10px; text-wrap: balance; }
.watch-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.watch-row .ch { font-weight: 600; }
.watch-row .sub { margin: 0; }
.yt-link { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; background: var(--panel-2); font-weight: 600; font-size: 14px; }
.yt-link:hover { background: var(--line); }
.back { display: inline-flex; gap: 6px; align-items: center; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0 0 12px; font-weight: 600; }
.back:hover { color: var(--fg); }
.box { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--panel); color: var(--muted); font-size: 14px; }
.queue h2 { font: 600 15px var(--font-body); margin: 0 0 12px; }
.q-item { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 10px; margin-bottom: 10px; cursor: pointer; border-radius: 10px; padding: 4px; }
.q-item:hover { background: var(--panel); }
.q-item .thumb { border-radius: 8px; }
.q-item .title { font-size: 14px; }
.q-item .sub { font-size: 12px; }

@media (max-width: 1100px) { .watch { grid-template-columns: 1fr; } }
@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; }
  .menu-btn { display: block; }
  aside {
    position: fixed; top: 57px; left: 0; z-index: 15; width: 260px; height: calc(100% - 57px);
    background: var(--bg); transform: translateX(-100%); transition: transform .2s;
  }
  body.menu-open aside { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.6); }
  main { padding-left: var(--gutter-l); }
  .count, .logo-word small { display: none; }
}
@media (max-width: 520px) {
  header { gap: 10px; }
  .logo-word { display: none; }
  .grid { grid-template-columns: 1fr; }
  .q-item { grid-template-columns: 140px minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <button class="menu-btn" id="menuBtn" aria-label="Abrir menú"><svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button>
  <a class="logo" href="#" id="home" aria-label="Inicio">
    <span class="logo-mark"><svg viewBox="0 0 10 12"><path d="M0 0l10 6-10 6z"/></svg></span>
    <span class="logo-word">BeefTube<small>ES</small></span>
  </a>
  <form class="search" id="searchForm" role="search">
    <input id="q" type="search" placeholder="Buscar en BeefTube" autocomplete="off" aria-label="Buscar">
    <button type="submit" aria-label="Buscar"><svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 016.32 12.9l5.39 5.4-1.41 1.4-5.4-5.39A8 8 0 1110 2zm0 2a6 6 0 100 12 6 6 0 000-12z"/></svg></button>
  </form>
  <span class="count" id="count"></span>
</header>

<div class="shell">
  <aside id="side">
    <h3>Alias</h3>
    <div id="aliasNav"></div>
    <h3>Tipo</h3>
    <div id="kindNav"></div>
    <p class="note">Lista revisada a mano. Solo entran videos de Yung Beef o en los que aparece él, con todos sus nombres.</p>
  </aside>
  <main id="main"></main>
</div>

<script src="videos.js"></script>
<script>
const ALIASES = [
  { id: 'all',    name: 'Todo',               short: 'ALL', color: '#5a4a46' },
  { id: 'beef',   name: 'Yung Beef',          short: 'YB',  color: '#e3262f' },
  { id: 'kitkat', name: 'Fernandito Kit Kat', short: 'FK',  color: '#c2410c' },
  { id: 'seko',   name: 'El Seko',            short: 'SK',  color: '#7c3aed' },
  { id: 'mafia',  name: 'La Mafia del Amor',  short: 'MA',  color: '#db2777' },
  { id: 'pxxr',   name: 'PXXR GVNG',          short: 'PG',  color: '#0e7490' },
];
const KINDS = [
  { id: 'all',     name: 'Todos' },
  { id: 'musica',  name: 'Canciones y videoclips' },
  { id: 'directo', name: 'En directo' },
  { id: 'charla',  name: 'Entrevistas y docs' },
];
const PAGE = 48;
const aliasById = Object.fromEntries(ALIASES.map(a => [a.id, a]));
const state = { alias: 'all', kind: 'all', q: '', shown: PAGE, order: 'top' };
const V = window.VIDEOS;
V.forEach((v, i) => { v.i = i; v.views = parseInt((v.v || '').replace(/\D/g, '')) || 0; });

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const thumb = id => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;

function filtered() {
  const q = norm(state.q.trim());
  let list = V.filter(v =>
    (state.alias === 'all' || v.tags.includes(state.alias)) &&
    (state.kind === 'all' || v.k === state.kind) &&
    (!q || norm(v.t + ' ' + v.c).includes(q)));
  if (state.order === 'views') list = [...list].sort((a, b) => b.views - a.views);
  if (state.order === 'shuffle') list = [...list].sort(() => Math.random() - 0.5);
  return list;
}

function avatar(v) {
  const a = aliasById[v.tags[0]];
  return `<span class="avatar" style="background:${a.color}">${a.short}</span>`;
}
function tagsHtml(v) {
  return v.tags.map(t => `<span class="tag">${aliasById[t].name}</span>`).join('');
}
function subLine(v) {
  return [v.c, v.v && `${v.v} visualizaciones`, v.p].filter(Boolean).map(esc).join(' · ');
}

function renderNav() {
  $('#aliasNav').innerHTML = ALIASES.map(a => {
    const n = a.id === 'all' ? V.length : V.filter(v => v.tags.includes(a.id)).length;
    return `<button class="nav-item ${state.alias === a.id ? 'on' : ''}" data-alias="${a.id}">
      <span class="dot" style="background:${a.color}">${a.short}</span>${a.name}<span class="n">${n}</span></button>`;
  }).join('');
  $('#kindNav').innerHTML = KINDS.map(k => {
    const n = k.id === 'all' ? V.length : V.filter(v => v.k === k.id).length;
    return `<button class="nav-item ${state.kind === k.id ? 'on' : ''}" data-kind="${k.id}">${k.name}<span class="n">${n}</span></button>`;
  }).join('');
}

function renderGrid() {
  const list = filtered();
  $('#count').textContent = `${list.length} videos`;
  const chips = [['top', 'Destacados'], ['views', 'Más vistos'], ['shuffle', 'Aleatorio']]
    .map(([id, n]) => `<button class="chip ${state.order === id ? 'on' : ''}" data-order="${id}">${n}</button>`).join('')
    + ALIASES.slice(1).map(a => `<button class="chip ${state.alias === a.id ? 'on' : ''}" data-alias="${a.id}">${a.name}</button>`).join('');
  const cards = list.slice(0, state.shown).map(v => `
    <a class="card" href="#ver=${v.id}">
      <div class="thumb"><img loading="lazy" src="${thumb(v.id)}" alt="">${v.d ? `<span class="dur">${esc(v.d)}</span>` : ''}</div>
      <div class="meta">${avatar(v)}<div class="meta-text">
        <div class="title">${esc(v.t)}</div>
        <div class="sub">${subLine(v)}</div>
        <div class="tags">${tagsHtml(v)}</div>
      </div></div>
    </a>`).join('');
  $('#main').innerHTML = `<div class="chips">${chips}</div>` +
    (list.length ? `<div class="grid">${cards}</div>` : `<p class="empty">No hay videos con esa búsqueda. Prueba con otro título o quita los filtros.</p>`) +
    (list.length > state.shown ? `<button class="more" id="more">Mostrar más (${list.length - state.shown} restantes)</button>` : '');
}

function renderWatch(id) {
  const v = V.find(x => x.id === id);
  if (!v) { location.hash = ''; return; }
  const related = V.filter(x => x.id !== id && x.tags.some(t => v.tags.includes(t)));
  const start = related.findIndex(x => x.i > v.i);
  const queue = [...related.slice(Math.max(start, 0)), ...related.slice(0, Math.max(start, 0))].slice(0, 20);
  const url = `https://www.youtube.com/watch?v=${v.id}`;
  $('#main').innerHTML = `
    <div class="watch">
      <div>
        <button class="back" id="back">← Volver a la lista</button>
        <div class="player"><iframe src="https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&rel=0" title="${esc(v.t)}"
          allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
        <h1>${esc(v.t)}</h1>
        <div class="watch-row">${avatar(v)}<div><div class="ch">${esc(v.c)}</div><div class="sub">${[v.v && v.v + ' visualizaciones', v.p].filter(Boolean).map(esc).join(' · ')}</div></div>
          <a class="yt-link" href="${url}" target="_blank" rel="noopener">Ver en YouTube ↗</a></div>
        <div class="box"><div class="tags" style="margin:0 0 6px">${tagsHtml(v)}</div>Si el video no se reproduce aquí, el canal ha desactivado la reproducción fuera de YouTube. Usa el botón «Ver en YouTube».</div>
      </div>
      <div class="queue"><h2>A continuación</h2>
        ${queue.map(x => `<a class="q-item" href="#ver=${x.id}">
          <div class="thumb"><img loading="lazy" src="${thumb(x.id)}" alt="">${x.d ? `<span class="dur">${esc(x.d)}</span>` : ''}</div>
          <div><div class="title">${esc(x.t)}</div><div class="sub">${esc(x.c)}</div></div></a>`).join('')}
      </div>
    </div>`;
  window.scrollTo(0, 0);
}

function route() {
  document.body.classList.remove('menu-open');
  const m = location.hash.match(/^#ver=([\w-]{11})/);
  if (m) renderWatch(m[1]); else renderGrid();
}

function goList() { if (location.hash) location.hash = ''; else renderGrid(); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-alias],[data-kind],[data-order],#more,#back,#home,#menuBtn');
  if (!t) return;
  if (t.id === 'menuBtn') { document.body.classList.toggle('menu-open'); return; }
  if (t.id === 'more') { state.shown += PAGE; renderGrid(); return; }
  if (t.id === 'back') { history.length > 1 ? history.back() : goList(); return; }
  e.preventDefault();
  if (t.id === 'home') { Object.assign(state, { alias: 'all', kind: 'all', q: '', order: 'top' }); $('#q').value = ''; }
  if (t.dataset.alias) state.alias = state.alias === t.dataset.alias && t.classList.contains('chip') ? 'all' : t.dataset.alias;
  if (t.dataset.kind) state.kind = t.dataset.kind;
  if (t.dataset.order) state.order = t.dataset.order;
  state.shown = PAGE;
  renderNav(); goList();
});
$('#searchForm').addEventListener('submit', e => { e.preventDefault(); state.q = $('#q').value; state.shown = PAGE; goList(); });
$('#q').addEventListener('input', e => { state.q = e.target.value; state.shown = PAGE; if (!location.hash) renderGrid(); });
window.addEventListener('hashchange', route);

renderNav();
route();
</script>
</body>
</html>
